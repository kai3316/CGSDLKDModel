# Enhanced YOLOv11 Model with Optimized Feature Fusion - FINAL FIXED VERSION

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Enhanced Backbone with Multi-Scale Connections
backbone:
  # Stage 1 (P1-P2)
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  
  # Stage 2 (P3)
  - [-1, 2, RGCSPELAN, [256, 0.5]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, RGCSPELAN, [512, 0.5]]  # 4
  
  # Stage 3 (P4)
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, CSP_PMSFA, [512, True]]  # 6
  
  # Stage 4 (P5)
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, CSP_PMSFA, [1024, True]]  # 8
  
  # Feature enhancement
  - [-1, 1, SPPF, [1024, 5]]  # 9

# Optimized Head with Multi-Path Fusion
head:
  # P5 to P4 upsampling path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 cat with stage3 output
  - [-1, 2, CSP_PMSFA, [512]]  # 12
  
  # P4 to P3 upsampling path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 cat with stage2 output
  - [-1, 2, RGCSPELAN, [256, 0.5]]  # 15 (P3/8)
  
  # Bottom-up fusion path - P3 to P4
  - [-1, 1, Conv, [256, 3, 2]]  # 16
  - [[-1, 12], 1, Concat, [1]]  # 17: Fuse current and P4
  - [-1, 2, CSP_PMSFA, [512]]  # 18 (P4/16)
  
  # P4 to P5
  - [-1, 1, Conv, [512, 3, 2]]  # 19
  - [[-1, 9], 1, Concat, [1]]  # 20: Fuse current and P5
  - [-1, 2, CSP_PMSFA, [1024]]  # 21 (P5/32)
  
  # 为每个检测层添加调整层
  - [15, 1, Conv, [256, 3, 1]]  # 22-P3调整
  - [18, 1, Conv, [512, 3, 1]]  # 23-P4调整
  - [21, 1, Conv, [1024, 3, 1]]  # 24-P5调整
  
  # 检测层
  - [[22, 23, 24], 1, Detect, [nc]]  # 25: Detect(P3, P4, P5)